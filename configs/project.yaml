seed: 42
classes:
  - Cardboard
  - Food Organics
  - Glass
  - Metal
  - Miscellaneous Trash
  - Paper
  - Plastic
  - Textile Trash
  - Vegetation
models: [mobilenet_v2, mobilenet_v3_large, shufflenet_v2_x1_0]
data:
  archive: data/realwaste.zip
  root: data/raw
  ratios: [0.8, 0.1, 0.1]
  phash_distance: 4
  calibration_images: 200
preprocessing:
  resize: 256
  crop: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
train:
  epochs: 20
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 5
  class_weights: true
  workers: 0
  device: auto
qat:
  epochs: 8
  batch_size: 16
  learning_rate: 0.00001
  freeze_observer_epoch: 4
  freeze_bn_epoch: 3
  device: auto
benchmark:
  threads: [1, 4]
  warmup: 30
  iterations: 200
  repeats: 3

export_validation:
  int8_policy: runtime_validation
